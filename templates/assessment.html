{% extends 'base.html' %}{% block content %}<main class="page"><h1>New assessment · {{patient.full_name}}</h1><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Age<input name="age" type="number" min="18" required></label><label>Sex<select name="sex"><option value="female">Female</option><option value="male">Male</option></select></label><label>Height (cm)<input name="height" type="number" step=".1" required></label><input type="hidden" name="height_unit" value="cm"><label>Weight (kg)<input name="weight" type="number" step=".1" required></label><input type="hidden" name="weight_unit" value="kg"><label>Activity<select name="activity"><option value="sedentary">Sedentary</option><option value="light">Light</option><option value="moderate">Moderate</option><option value="very">Very active</option><option value="extra">Extremely active</option></select></label><label>Goal<select name="goal"><option value="maintain">Maintain</option><option value="loss">Gentle loss</option><option value="gain">Gradual gain</option></select></label><label>Notes<textarea name="notes"></textarea></label><button class="button">Save assessment</button></form></main>{% endblock %}
