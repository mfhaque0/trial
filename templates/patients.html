{% extends 'base.html' %}{% block content %}<main class="page"><h1>Patients</h1><div class="split"><section class="card"><h2>Add patient</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Full name<input name="full_name" required></label><label>Date of birth<input type="date" name="date_of_birth"></label><label>Sex<input name="sex"></label><label>Contact<input name="contact"></label><label>Notes<textarea name="medical_notes"></textarea></label><button class="button">Save patient</button></form></section><section class="card"><form><label>Search patients<input name="q" value="{{query}}"></label></form>{% if patients %}<ul>{% for p in patients %}<li><a href="/patients/{{p.id}}">{{p.full_name}}</a><small>{{p.updated_at[:10]}}</small></li>{% endfor %}</ul>{% else %}<p>Your patient list will appear here.</p>{% endif %}</section></div></main>{% endblock %}
