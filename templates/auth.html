{% extends 'base.html' %}{% block content %}<main class="auth card"><h1>{{'Create your workspace' if mode=='signup' else 'Welcome back'}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}">{% if mode=='signup' %}<label>Name<input name="display_name" required></label>{% endif %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="10" required></label><button class="button">{{'Sign up' if mode=='signup' else 'Log in'}}</button></form><p><a href="{{'/auth/login' if mode=='signup' else '/auth/signup'}}">{{'Already have an account? Log in' if mode=='signup' else 'New here? Create an account'}}</a></p></main>{% endblock %}
