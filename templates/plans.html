{% extends 'base.html' %}{% block content %}<main class="page"><h1>Diet plans</h1><div class="split"><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Patient<select name="patient_id">{% for p in patients %}<option value="{{p.id}}">{{p.full_name}}</option>{% endfor %}</select></label><label>Plan title<input name="title"></label><label>Notes<textarea name="notes"></textarea></label><button class="button">Create diet plan</button></form><section class="card">{% for p in plans %}<p><a href="/plans/{{p.id}}">{{p.title}}</a> · {{p.full_name}}</p>{% else %}<p>No diet plans yet. Create a personalized plan for a patient.</p>{% endfor %}</section></div></main>{% endblock %}
